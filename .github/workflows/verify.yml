name: Verify portfolio evidence
on: [push, pull_request]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B -m unittest -v
      - run: python3 verify.py
        env:
          GH_TOKEN: ${{ github.token }}
